kind = "web"
previewPath = "/"
title = "NagpurSetu"
description = "A unified civic and emergency dashboard for Nagpur citizens, combining rapid SOS access, live municipal impact, waste grievance tracking, healthcare and metro information, and community innovation."
version = "1.0.0"
id = "artifacts/nagpursetu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21103

[services.development]
run = "pnpm --filter @workspace/nagpursetu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nagpursetu", "run", "build" ]
serve = "static"
publicDir = "artifacts/nagpursetu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21103"
BASE_PATH = "/"
